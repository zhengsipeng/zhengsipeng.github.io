# Site settings — restart `jekyll serve` after editing this file.

title: "Sipeng Zheng"
title_zh: "郑思鹏"
description: >-
  Sipeng Zheng is a Partner at BeingBeyond working on embodied foundation models,
  vision-language-action models, learning from egocentric human videos, and humanoid robotics.
url: "https://zhengsipeng.github.io"
baseurl: ""
lang: en
repository: "zhengsipeng/zhengsipeng.github.io"

google_analytics_id: G-0LQ3LBVQT2

# Number of news items shown before the "Earlier news" toggle.
news_visible: 8

# ---------------------------------------------------------------------------
# Author / profile (used in the hero, footer, and SEO metadata)
# ---------------------------------------------------------------------------
author:
  name: "Sipeng Zheng"
  name_zh: "郑思鹏"
  role: "Partner"
  affiliation: "BeingBeyond"
  affiliation_url: "https://www.beingbeyond.com"
  focus: "Lead, Embodied Multimodal Pretraining"
  location: "Beijing, China"
  avatar: "assets/images/profile.jpg"
  avatar_webp: "assets/images/profile.webp"
  email: "spzheng@beingbeyond.com"
  cv: "files/cv_zsp_en.pdf"
  googlescholar: "https://scholar.google.com/citations?user=OonuDhcAAAAJ"
  github: "zhengsipeng"
  linkedin: "sipengz"
  dblp: "https://dblp.org/pid/251/3691.html"
  notes: "https://research.beingbeyond.com/"
  tagline: "Building foundation models that let humanoid robots learn from how humans see and act."
  interests:
    - Embodied foundation models
    - Vision-language-action models
    - Learning from egocentric video
    - Humanoid robotics
    - Large multimodal models

# Topic filters for the publication list (keys used in _data/publications.yml).
topics:
  - { key: embodied, label: "Embodied AI" }
  - { key: motion, label: "Human Motion" }
  - { key: mllm, label: "Multimodal LLMs" }
  - { key: video, label: "Video Understanding" }

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - run_server.sh
  - vendor
  - node_modules
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - .codex-backups
encoding: "utf-8"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope: { path: "" }
    values: { layout: default }

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
