# Publications — single source of truth for the publication list and research cards.
#
# Fields
#   id         unique key, referenced from _data/research.yml
#   title      paper title
#   short      optional model / project name shown in research cards (e.g. "Being-H0.5")
#   url        main paper link (title links here)
#   venue      e.g. "CoRL 2026"; leave empty for unpublished work
#   year       used for grouping in the list
#   award      optional distinction, e.g. "Oral"; award_rate e.g. "1%"
#   authors    plain text; "Sipeng Zheng" is highlighted automatically, "*" marks equal contribution
#   summary    optional one-line description (used in research cards)
#   links      list of { type, url, soon }; type: blog | code | model | page | paper
#   topics     any of: embodied | motion | mllm | video   (drives the topic filters)
#   selected   true → shown in the default "Selected" view
#   image      optional figure slug in assets/images/papers/<slug>-{640,1280}.webp
#
# Order within a year is preserved as written.

